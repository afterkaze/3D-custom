# Runs the self-contained checks on every pull request and push to main.
# (ui:check and eshop:check use covers from a local data/ folder, so they run on developer machines only.)
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-22.04
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: mkdir -p output
      - name: Syntax
        run: for f in *.js renderer/*.js scripts/*.cjs; do node --check "$f" || exit 1; done
      - name: Emulator catalog patterns
        run: node -e "for (const e of require('./emulators.json')) for (const p of [e.asset, e.exe, e.linux?.asset, e.linux?.exe]) if (p) new RegExp(p)"
      - name: Artwork downloads
        run: xvfb-run -a npm run artwork:check
      - name: Case carousel
        run: xvfb-run -a npm run carousel:check
      - name: Button prompts
        run: xvfb-run -a npm run prompts:check
      - name: Brand assets
        run: xvfb-run -a npm run brand:check
